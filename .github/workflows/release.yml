name: Build and Release Multi-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows (Setup + Portable + MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Windows Packages
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Release Assets (Setup + Portable + MSI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-win
          # 1. Setup Installer (.exe)
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-win/PDFTools_${{ github.ref_name }}_Setup_x64.exe"
          }
          # 2. Standalone Portable Single-File (.exe)
          if (Test-Path "src-tauri/target/release/pdftools.exe") {
            Copy-Item "src-tauri/target/release/pdftools.exe" -Destination "release-win/PDFTools_${{ github.ref_name }}_Portable_x64.exe"
          }
          # 3. MSI Installer (.msi)
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-win/PDFTools_${{ github.ref_name }}_x64.msi"
          }
          Get-ChildItem -Path release-win

      - name: Publish Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PDFTools ${{ github.ref_name }} 正式版 (Windows 安装版/绿色版 & macOS 版)
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-win/*.exe
            release-win/*.msi

  release-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri macOS DMG
        run: npx tauri build --bundles dmg,app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare macOS Release Assets (.dmg)
        run: |
          mkdir -p release-mac
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              cp "$f" "release-mac/PDFTools_${{ github.ref_name }}_macOS.dmg"
            fi
          done
          ls -la release-mac

      - name: Publish macOS Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PDFTools ${{ github.ref_name }} 正式版 (Windows 安装版/绿色版 & macOS 版)
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-mac/*.dmg
