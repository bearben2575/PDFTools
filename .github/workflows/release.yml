name: Build and Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Ultra-Lightweight Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Package (.exe & .msi)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-dist
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-dist/PDFTools_v${{ github.ref_name }}_Setup_x64.exe"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-dist/PDFTools_v${{ github.ref_name }}_x64.msi"
          }
          Get-ChildItem -Path release-dist

      - name: Publish GitHub Release with 3MB Lightweight EXE
        uses: softprops/action-gh-release@v2
        with:
          name: PDFTools ${{ github.ref_name }} 正式版 (仅 3MB 超轻量 Windows 安装包)
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.exe
            release-dist/*.msi
